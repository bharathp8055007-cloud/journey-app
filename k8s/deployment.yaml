apiVersion: apps/v1
kind: Deployment
metadata: 
   name: journey-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: journey-app
  template:
    metadata: 
       labels:
          app: journey-app
    spec:
      containers:
       - name: journey-app
         image: bharathp8055/journey-app:v1
         ports:
         - containerPort: 5000


